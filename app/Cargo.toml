[package]
name = "orderflow-cache"
version = "0.2.0"
edition = "2021"
description = "Flash-sale distributed cache architecture PoC (Rust server)"

[dependencies]
axum = { version = "0.7.9", features = ["json"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7.4", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
redis = { version = "0.25.4", features = ["tokio-comp", "connection-manager"] }
prometheus = "0.13.4"
rand = "0.8.5"
crc32fast = "1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
