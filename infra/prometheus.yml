global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: orderflow-rust
    # Docker DNS service discovery via DNS A records, including app replicas.
    dns_sd_configs:
      - names: ["app"]
        type: A
        port: 8000
        refresh_interval: 5s
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis1
    static_configs:
      - targets: ["redis1-exporter:9121"]
  - job_name: redis2
    static_configs:
      - targets: ["redis2-exporter:9121"]
  - job_name: campaign
    honor_labels: true
    scrape_interval: 2s
    static_configs:
      - targets: ["pushgateway:9091"]
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
